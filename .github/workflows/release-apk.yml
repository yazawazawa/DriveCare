name: Release APK

# 次のどちらかで、APK をビルドして GitHub のリリースに添付する。
#  - `v` で始まるタグ（例: v0.0.1a）を push する
#  - Actions タブの「Run workflow」で、リリース名（タグ名）を入力して実行する。
#    タグが無ければ、実行したブランチの最新コミットに自動で作られる。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースのタグ名（例: v0.0.1a）。無ければ作成されます'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      # 署名キーと Firebase 設定は GitHub の Secrets から取り込む（未設定でもビルドは通る）。
      #   ANDROID_DEBUG_KEYSTORE_BASE64 : ~/.android/debug.keystore を base64 にしたもの
      #   GOOGLE_SERVICES_JSON_BASE64   : app/google-services.json を base64 にしたもの
      # 設定すると、手元でビルドしたアプリと同じ署名になり（上書きインストール可・Google ログインも同じSHA-1で動く）、
      # クラウド共有も使える。設定しない場合は、署名が毎回変わり、クラウド共有は「未設定」になる。
      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "署名キー: Secrets のキーを使用"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 が未設定です。APK の署名は毎回変わります。"
          fi
          if [ -n "$SERVICES_B64" ]; then
            echo "$SERVICES_B64" | base64 -d > app/google-services.json
            echo "Firebase 設定: Secrets の google-services.json を使用"
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 が未設定です。クラウド共有は「未設定」になります。"
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          APK="DriveCare-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "DriveCare ${VERSION}" --generate-notes
          fi
